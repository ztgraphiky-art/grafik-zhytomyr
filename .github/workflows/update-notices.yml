
name: Автоматичне оновлення графіка та повідомлень

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-electricity-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Завантажити репозиторій
        uses: actions/checkout@v4

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити бібліотеки
        run: pip install requests beautifulsoup4

      - name: Отримати офіційне повідомлення
        run: python scripts/fetch_notices.py

      - name: Отримати графік відключень
        run: python scripts/fetch_schedule.py

      - name: Зберегти оновлені дані
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/notices.json data/schedule.json

          if ! git diff --cached --quiet; then
            git commit -m "Автоматичне оновлення графіка"
            git push
          else
            echo "Дані не змінилися"
          fi

